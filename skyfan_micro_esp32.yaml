packages:
  skyfan.tuya_fan: !include
    file: supplemental/tuya_fan.yaml
  skyfan.tuya_light: !include
    file: supplemental/tuya_light.yaml

substitutions:
  device_name: easy-skyfandc
  temp_name: SkyFanDC-Temp
  skyfan_model: "SKY1203"
  light_name: "SkyFan DC Light"
  fan_name: "SkyFan DC Fan"

esphome:
  name: ${device_name}
  name_add_mac_suffix: true
  project:
    name: memphisraynz.easy_skyfandc_esp32
    version: "0.9.5"

dashboard_import:
  package_import_url: github://memphisraynz/skyfandc/skyfan_micro_esp32.yaml@main

api:

logger:
  baud_rate: 0

# i2c:
#   sda: 4
#   scl: 5
#   scan: true

ota:
  - platform: esphome  

wifi:
  ap:
    password: ""
    
# captive_portal:

tuya:
  id: tuyamcu  

switch:
  - platform: gpio
    pin:
      number: 2
      inverted: true
    id: led
